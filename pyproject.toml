[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "simulforge"
version = "1.0.0"
description = "End-to-end streaming speech-to-speech simultaneous interpretation engine (Hy-SimulMT-style reference implementation)"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "ai-daily-agent" }]
keywords = ["simultaneous-interpretation", "speech-to-speech", "simulmt", "voice-cloning", "streamlaal", "zero-dependency"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = []

[project.scripts]
simulforge = "simulforge.cli:main"

[tool.setuptools]
packages = [
    "simulforge",
    "simulforge.audio",
    "simulforge.policy",
    "simulforge.cascade",
    "simulforge.s2s",
    "simulforge.latency",
    "simulforge.eval",
    "simulforge.model",
    "simulforge.utils",
]
