name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile check
        run: python -m compileall -q simulforge tests
      - name: Unit tests
        run: python -m unittest discover -s tests -t .
      - name: Doctor smoke
        run: python -m simulforge.cli doctor --skill 0.5
      - name: Benchmark
        run: python -m simulforge.bench
